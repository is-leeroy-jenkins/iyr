name: Implement Live World Agent Tools

on:
  push:
    branches:
      - feature/live-world-agent-tools
    paths:
      - .github/workflows/implement-live-world-agent-tools.yml
      - .github/scripts/implement_live_world_agent_tools.py

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-world-agent-tools
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair helper clear anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path( '.github/scripts/implement_live_world_agent_tools.py' )
          text = path.read_text( encoding='utf-8' )
          text = text.replace(
              "\\t\\tst.session_state[ 'live_world_geofence_last_refresh_processed' ] = ''\\n\\t\\tst.session_state[ 'live_world_last_refresh' ] = ''",
              "\\tst.session_state[ 'live_world_geofence_last_refresh_processed' ] = ''\\n\\tst.session_state[ 'live_world_last_refresh' ] = ''" )
          text = text.replace(
              "\\t\\tst.session_state[ 'live_world_geofence_last_refresh_processed' ] = ''\\n\\t\\tst.session_state[ 'live_world_agent_result' ] = { }\\n\\t\\tst.session_state[ 'live_world_agent_last_error' ] = ''\\n\\t\\tst.session_state[ 'live_world_last_refresh' ] = ''",
              "\\tst.session_state[ 'live_world_geofence_last_refresh_processed' ] = ''\\n\\tst.session_state[ 'live_world_agent_result' ] = { }\\n\\tst.session_state[ 'live_world_agent_last_error' ] = ''\\n\\tst.session_state[ 'live_world_last_refresh' ] = ''" )
          path.write_text( text, encoding='utf-8' )
          PY

      - name: Implement Agent Tools
        run: python .github/scripts/implement_live_world_agent_tools.py

      - name: Check conflict markers
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' --include='*.md' . --exclude-dir=.git; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify Agent Tools contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          live_world = Path( 'live_world.py' ).read_text( encoding='utf-8' )
          tools = Path( 'live_world_agent_tools.py' ).read_text( encoding='utf-8' )
          required_live_world = [
              "'agent_tools': '🤖 Agent Tools'", "'live_world_agent_tools': False",
              'def run_live_world_agent_tool( )', "key='live_world_agent_tools'",
              "'🤖 Agent Tools'", 'with agent_tools_tab:' ]
          required_tools = [
              'def get_live_world_status( )',
              'def list_live_world_entities( entity_type: str, limit: int )',
              'def search_live_world_entities( query: str, entity_type: str, limit: int )',
              'def find_live_world_nearest( latitude: float, longitude: float, radius_nm: float,',
              'def get_live_world_geofence_status( )',
              'def get_live_world_tracking_status( )',
              'LIVE_WORLD_AGENT_TOOLS: Dict[ str, object ]' ]
          for value in required_live_world:
              if value not in live_world:
                  raise RuntimeError( f'Missing Agent Tools Live World contract: {value}' )
          for value in required_tools:
              if value not in tools:
                  raise RuntimeError( f'Missing Agent Tools callable contract: {value}' )
          print( 'Agent Tools contracts verified.' )
          PY

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- live_world.py; then
            echo 'No Live World integration changes detected.'
            exit 1
          fi
          git config user.name 'Terry Eppler'
          git config user.email 'terry.eppler@gmail.com'
          git add live_world.py
          git commit -m 'Integrate Live World agent tools'
          git push origin feature/live-world-agent-tools
