name: Implement Additional Map Layers

on:
  push:
    branches:
      - feature/additional-map-layers
    paths:
      - .github/workflows/implement-additional-map-layers.yml
      - .github/scripts/implement_additional_map_layers.py

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/additional-map-layers
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Implement Additional Map Layers
        run: python .github/scripts/implement_additional_map_layers.py

      - name: Check conflict markers
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' --include='*.md' . --exclude-dir=.git; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify Additional Map Layers contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          world = Path( 'world.py' ).read_text( encoding='utf-8' )
          sources = Path( 'sources.py' ).read_text( encoding='utf-8' )

          world_contracts = [
              "'map_layers': '🗺️ Additional Map Layers'",
              "'live_world_map_layers': False",
              "def fetch_live_map_layers( latitude: float, longitude: float ) -> pd.DataFrame:",
              "st.session_state[ 'live_world_df_map_layers' ]",
              "'Map Feature'",
              "'🗺️ Map Layers'",
              "with map_layers_tab:",
          ]
          source_contracts = [
              'class OverpassMapLayers:',
              'def fetch_features( self, latitude: float, longitude: float, radius_km: float,',
              'def classify_feature( self, tags: Dict[ str, Any ] ) -> str:',
              "'Public Transit'",
              "'Bike Share'",
              "'Emergency Services'",
              "'Healthcare'",
              "'EV Charging'",
              "'Communications'",
              "'Launch Sites'",
          ]
          for value in world_contracts:
              if value not in world:
                  raise RuntimeError( f'Missing world contract: {value}' )
          for value in source_contracts:
              if value not in sources:
                  raise RuntimeError( f'Missing source contract: {value}' )
          if "LIVE_WORLD_PENDING_LAYERS: Dict[ str, str ] = {\n}" not in world:
              raise RuntimeError( 'Additional Map Layers was not removed from pending layers.' )
          print( 'Additional Map Layers contracts verified.' )
          PY

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- world.py sources.py; then
            echo 'No Additional Map Layers changes detected.'
            exit 1
          fi
          git config user.name 'Terry Eppler'
          git config user.email 'terry.eppler@gmail.com'
          git add world.py sources.py
          git commit -m 'Implement Additional Map Layers'
          git push origin feature/additional-map-layers
