name: Implement Live World Historical Replay

on:
  push:
    branches:
      - feature/live-world-historical-replay
    paths:
      - .github/workflows/implement-live-world-historical-replay.yml
      - .github/scripts/implement_live_world_historical_replay.py

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-world-historical-replay
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Implement Historical Replay
        run: python .github/scripts/implement_live_world_historical_replay.py

      - name: Check conflict markers
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' --include='*.md' . --exclude-dir=.git; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify Historical Replay contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          live_world = Path( 'live_world.py' ).read_text( encoding='utf-8' )
          history = Path( 'live_world_history.py' ).read_text( encoding='utf-8' )
          required_live_world = [
              "'historical_replay': '🕓 Historical Replay'",
              "'live_world_historical_replay': False",
              'def get_live_world_history_window_hours( window: str )',
              'def load_live_world_replay_frame( )',
              'persist_live_world_history(',
              "key='live_world_historical_replay'",
              "'🕓 Historical Replay'",
              'with history_tab:',
          ]
          required_history = [
              'def initialize_live_world_history( )',
              'def persist_live_world_history( df_entities: pd.DataFrame, refresh_id: str,',
              'def purge_live_world_history( retention_days: int )',
              'def clear_live_world_history( )',
              'def get_live_world_history_snapshots( hours: int=24 )',
              'def load_live_world_history( hours: int, entity_types: List[ str ], snapshot: str,',
              'def get_live_world_history_summary( )',
              "HISTORY_TABLE = 'LiveWorldHistory'",
          ]
          for value in required_live_world:
              if value not in live_world:
                  raise RuntimeError( f'Missing Historical Replay Live World contract: {value}' )
          for value in required_history:
              if value not in history:
                  raise RuntimeError( f'Missing Historical Replay persistence contract: {value}' )
          print( 'Historical Replay contracts verified.' )
          PY

      - name: Smoke test history persistence
        run: |
          python - <<'PY'
          import os
          import sqlite3
          import tempfile
          import pandas as pd
          import config as cfg
          import live_world_history as history

          handle, path = tempfile.mkstemp( suffix='.db' )
          os.close( handle )
          cfg.DB_PATH = path
          history.cfg.DB_PATH = path
          df = pd.DataFrame( [ {
              'EntityId': 'A1', 'EntityType': 'Aircraft', 'Name': 'Test Aircraft',
              'Latitude': 38.9, 'Longitude': -77.0, 'Altitude': 1000.0,
              'Heading': 90.0, 'Speed': 120.0, 'Timestamp': '2026-09-12T18:00:00+00:00',
              'Source': 'Test', 'Metadata': { 'test': True } } ] )
          inserted = history.persist_live_world_history(
              df, '2026-09-12T18:00:00+00:00', '2026-09-12T18:00:00+00:00' )
          assert inserted == 1
          assert history.persist_live_world_history(
              df, '2026-09-12T18:00:00+00:00', '2026-09-12T18:00:00+00:00' ) == 0
          snapshots = history.get_live_world_history_snapshots( 0 )
          assert snapshots == [ '2026-09-12T18:00:00+00:00' ]
          replay = history.load_live_world_history(
              0, [ 'Aircraft' ], snapshots[ 0 ], 100 )
          assert len( replay.index ) == 1
          assert replay.iloc[ 0 ][ 'Metadata' ][ 'test' ] is True
          summary = history.get_live_world_history_summary( )
          assert summary[ 'ObservationCount' ] == 1
          os.remove( path )
          print( 'Historical persistence smoke test passed.' )
          PY

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- live_world.py; then
            echo 'No Live World Historical Replay integration changes detected.'
            exit 1
          fi
          git config user.name 'Terry Eppler'
          git config user.email 'terry.eppler@gmail.com'
          git add live_world.py
          git commit -m 'Integrate Live World historical replay'
          git push origin feature/live-world-historical-replay
