name: Implement CCTV and Module Renames

on:
  push:
    branches:
      - feature/live-world-cameras-and-renames
    paths:
      - .github/workflows/implement-cameras-and-module-renames.yml
      - .github/scripts/implement_cameras_and_module_renames.py

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-world-cameras-and-renames
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Implement CCTV/Web Cameras and module renames
        run: python .github/scripts/implement_cameras_and_module_renames.py

      - name: Check conflict markers
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' --include='*.md' . --exclude-dir=.git; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify renamed module contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [ 'world.py', 'tools.py', 'history.py', 'sources.py' ]
          removed = [ 'live_world.py', 'live_world_agent_tools.py', 'live_world_history.py', 'live_world_sources.py' ]
          for value in required:
              if not Path( value ).exists( ):
                  raise RuntimeError( f'Missing renamed module: {value}' )
          for value in removed:
              if Path( value ).exists( ):
                  raise RuntimeError( f'Old module still exists: {value}' )

          app = Path( 'app.py' ).read_text( encoding='utf-8' )
          world = Path( 'world.py' ).read_text( encoding='utf-8' )
          sources = Path( 'sources.py' ).read_text( encoding='utf-8' )
          required_world = [
              "'cameras': '📷 CCTV / Web Cameras'",
              "'live_world_cameras': False",
              "def fetch_live_cameras( latitude: float, longitude: float )",
              "st.session_state[ 'live_world_df_cameras' ]",
              "'📷 Cameras'",
              "with cameras_tab:",
              "'Camera'",
          ]
          required_sources = [
              'class OverpassCameras:',
              'def fetch_cameras( self, latitude: float, longitude: float, radius_km: float,',
              'def classify_camera( self, tags: Dict[ str, Any ] ) -> str:',
              "'CCTV / Surveillance'",
              "'Web Cameras'",
          ]
          if 'from world import render_live_world_map, render_live_world_sidebar' not in app:
              raise RuntimeError( 'app.py was not updated to import world.py.' )
          if 'from history import (' not in world or 'from sources import (' not in world:
              raise RuntimeError( 'world.py does not use renamed history.py/sources.py modules.' )
          for value in required_world:
              if value not in world:
                  raise RuntimeError( f'Missing camera world contract: {value}' )
          for value in required_sources:
              if value not in sources:
                  raise RuntimeError( f'Missing camera provider contract: {value}' )
          print( 'CCTV/Web Cameras and renamed module contracts verified.' )
          PY

      - name: Verify no stale module imports
        shell: bash
        run: |
          if grep -R -n -E 'from (live_world|live_world_history|live_world_sources|live_world_agent_tools) import' --include='*.py' . --exclude-dir=.git; then
            echo 'Stale module imports found.'
            exit 1
          fi

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No CCTV/module rename changes detected.'
            exit 1
          fi
          git config user.name 'Terry Eppler'
          git config user.email 'terry.eppler@gmail.com'
          git add -A
          git commit -m 'Implement CCTV layer and rename Live World modules'
          git push origin feature/live-world-cameras-and-renames
