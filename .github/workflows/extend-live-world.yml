name: Extend Live World Data

on:
  push:
    branches:
      - feature/live-world-data
    paths:
      - .github/workflows/extend-live-world.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/live-world-data

      - name: Extend Live World Data
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path( 'live_world.py' )
          text = path.read_text( encoding='utf-8' )

          import_anchor = "from fetchers import Firms, USGSEarthquakes\n"
          import_block = import_anchor + "from live_world_sources import CelesTrakLive, OpenSkyLive\n"
          if 'from live_world_sources import CelesTrakLive, OpenSkyLive' not in text:
              if import_anchor not in text:
                  raise RuntimeError( 'Unable to locate Live World provider import anchor.' )
              text = text.replace( import_anchor, import_block, 1 )

          layers_old = (
              "LIVE_WORLD_LAYERS: Dict[ str, str ] = {\n"
              "\t'earthquakes': '📈 Earthquakes',\n"
              "\t'fires': '🔥 Fires (Wildfires)',\n"
              "}\n"
          )
          layers_new = (
              "LIVE_WORLD_LAYERS: Dict[ str, str ] = {\n"
              "\t'aircraft': '✈️ Aircraft (Live)',\n"
              "\t'satellites': '🛰️ Satellites',\n"
              "\t'earthquakes': '📈 Earthquakes',\n"
              "\t'fires': '🔥 Fires (Wildfires)',\n"
              "}\n"
          )
          if "\t'aircraft': '✈️ Aircraft (Live)',\n" not in text.split( 'LIVE_WORLD_PENDING_LAYERS', 1 )[ 0 ]:
              if layers_old not in text:
                  raise RuntimeError( 'Unable to locate implemented layer contract.' )
              text = text.replace( layers_old, layers_new, 1 )

          text = text.replace( "\t'aircraft': '✈️ Aircraft (Live)',\n", '', 1 ) if text.count( "\t'aircraft': '✈️ Aircraft (Live)',\n" ) > 1 else text
          text = text.replace( "\t'satellites': '🛰️ Satellites',\n", '', 1 ) if text.count( "\t'satellites': '🛰️ Satellites',\n" ) > 1 else text

          defaults_anchor = "\t\t'live_world_enabled': False,\n\t\t'live_world_earthquakes': False,\n"
          defaults_block = (
              "\t\t'live_world_enabled': False,\n"
              "\t\t'live_world_aircraft': False,\n"
              "\t\t'live_world_aircraft_radius': 2.0,\n"
              "\t\t'live_world_aircraft_airborne_only': True,\n"
              "\t\t'live_world_satellites': False,\n"
              "\t\t'live_world_satellite_group': 'stations',\n"
              "\t\t'live_world_satellite_limit': 100,\n"
              "\t\t'live_world_earthquakes': False,\n"
          )
          if "'live_world_aircraft_radius'" not in text:
              if defaults_anchor not in text:
                  raise RuntimeError( 'Unable to locate Live World state anchor.' )
              text = text.replace( defaults_anchor, defaults_block, 1 )

          frame_anchor = "\t\t'live_world_df_entities': pd.DataFrame( ),\n\t\t'live_world_df_earthquakes': pd.DataFrame( ),\n"
          frame_block = (
              "\t\t'live_world_df_entities': pd.DataFrame( ),\n"
              "\t\t'live_world_df_aircraft': pd.DataFrame( ),\n"
              "\t\t'live_world_df_satellites': pd.DataFrame( ),\n"
              "\t\t'live_world_df_earthquakes': pd.DataFrame( ),\n"
          )
          if "'live_world_df_aircraft'" not in text:
              text = text.replace( frame_anchor, frame_block, 1 )

          result_anchor = "\t\t'live_world_earthquake_result': { },\n"
          result_block = (
              "\t\t'live_world_aircraft_result': { },\n"
              "\t\t'live_world_satellite_result': [ ],\n"
              "\t\t'live_world_earthquake_result': { },\n"
          )
          if "'live_world_aircraft_result'" not in text:
              text = text.replace( result_anchor, result_block, 1 )

          sidebar_anchor = "\t\tst.caption( 'Live Layers' )\n\n\t\tst.checkbox( LIVE_WORLD_LAYERS[ 'earthquakes' ], key='live_world_earthquakes' )\n"
          sidebar_block = """\t\tst.caption( 'Live Layers' )

\t\tst.checkbox( LIVE_WORLD_LAYERS[ 'aircraft' ], key='live_world_aircraft' )
\t\tif st.session_state[ 'live_world_aircraft' ]:
\t\t\tst.slider( 'Aircraft Radius (Degrees)', min_value=0.25, max_value=10.0,
\t\t\t\tstep=0.25, key='live_world_aircraft_radius' )
\t\t\tst.checkbox( 'Airborne Only', key='live_world_aircraft_airborne_only' )
\t\t\tst.caption( 'OpenSky API Client credentials are used when configured.' )

\t\tst.checkbox( LIVE_WORLD_LAYERS[ 'satellites' ], key='live_world_satellites' )
\t\tif st.session_state[ 'live_world_satellites' ]:
\t\t\tst.selectbox( 'Satellite Group',
\t\t\t\toptions=[ 'stations', 'visual', 'weather', 'gps-ops', 'active' ],
\t\t\t\tkey='live_world_satellite_group' )
\t\t\tst.slider( 'Satellite Limit', min_value=10, max_value=500, step=10,
\t\t\t\tkey='live_world_satellite_limit' )

\t\tst.checkbox( LIVE_WORLD_LAYERS[ 'earthquakes' ], key='live_world_earthquakes' )
"""
          if "st.checkbox( LIVE_WORLD_LAYERS[ 'aircraft' ]" not in text:
              if sidebar_anchor not in text:
                  raise RuntimeError( 'Unable to locate Live World sidebar anchor.' )
              text = text.replace( sidebar_anchor, sidebar_block, 1 )

          clear_anchor = "\tst.session_state[ 'live_world_df_entities' ] = pd.DataFrame( )\n\tst.session_state[ 'live_world_df_earthquakes' ] = pd.DataFrame( )\n"
          clear_block = (
              "\tst.session_state[ 'live_world_df_entities' ] = pd.DataFrame( )\n"
              "\tst.session_state[ 'live_world_df_aircraft' ] = pd.DataFrame( )\n"
              "\tst.session_state[ 'live_world_df_satellites' ] = pd.DataFrame( )\n"
              "\tst.session_state[ 'live_world_df_earthquakes' ] = pd.DataFrame( )\n"
          )
          if "st.session_state[ 'live_world_df_aircraft' ] = pd.DataFrame( )" not in text.split( 'def create_live_world_bounding_box', 1 )[ 0]:
              text = text.replace( clear_anchor, clear_block, 1 )

          clear_result_anchor = "\tst.session_state[ 'live_world_earthquake_result' ] = { }\n"
          clear_result_block = (
              "\tst.session_state[ 'live_world_aircraft_result' ] = { }\n"
              "\tst.session_state[ 'live_world_satellite_result' ] = [ ]\n"
              "\tst.session_state[ 'live_world_earthquake_result' ] = { }\n"
          )
          if "st.session_state[ 'live_world_aircraft_result' ] = { }" not in text.split( 'def create_live_world_bounding_box', 1 )[ 0]:
              text = text.replace( clear_result_anchor, clear_result_block, 1 )

          fetch_anchor = "def fetch_live_earthquakes( ) -> pd.DataFrame:\n"
          fetch_functions = r'''def fetch_live_aircraft( latitude: float, longitude: float ) -> pd.DataFrame:
\t'''
\n\t\tPurpose:
\t\t--------
\t\tRetrieve current OpenSky aircraft state vectors around the Iyr/global location and
\t\tnormalize positioned aircraft for Live World rendering.

\t\tParameters:
\t\t-----------
\t\tlatitude (float): Geographic center latitude.
\t\tlongitude (float): Geographic center longitude.

\t\tReturns:
\t\t--------
\t\tpd.DataFrame: Normalized aircraft entities.

\t'''
\tinitialize_live_world_state( )
\tthrow_if( 'latitude', latitude )
\tthrow_if( 'longitude', longitude )
\tclient_id = str( st.session_state.get( 'opensky_api_client_id', '' ) or '' )
\tclient_secret = str( st.session_state.get( 'opensky_api_credentials', '' ) or '' )
\tradius = float( st.session_state[ 'live_world_aircraft_radius' ] )
\tairborne_only = bool( st.session_state[ 'live_world_aircraft_airborne_only' ] )
\tservice = OpenSkyLive( client_id=client_id, client_secret=client_secret, timeout=20 )
\tresult = service.fetch_states( latitude=latitude, longitude=longitude,
\t\tradius_degrees=radius ) or { }
\tstates = result.get( 'states', [ ] ) or [ ]
\tentities: List[ GeoEntity ] = [ ]

\tfor state in states:
\t\tif not isinstance( state, list ) or len( state ) < 17:
\t\t\tcontinue
\t\ticao24 = str( state[ 0 ] or '' ).strip( )
\t\tcallsign = str( state[ 1 ] or '' ).strip( )
\t\tlongitude_value = state[ 5 ]
\t\tlatitude_value = state[ 6 ]
\t\tif latitude_value is None or longitude_value is None:
\t\t\tcontinue
\t\ton_ground = bool( state[ 8 ] )
\t\tif airborne_only and on_ground:
\t\t\tcontinue
\t\ttry:
\t\t\tlat = float( latitude_value )
\t\t\tlon = float( longitude_value )
\t\texcept ( TypeError, ValueError ):
\t\t\tcontinue
\t\tgeo_altitude = state[ 13 ] if len( state ) > 13 else None
\t\tbaro_altitude = state[ 7 ] if len( state ) > 7 else None
\t\taltitude = geo_altitude if geo_altitude is not None else baro_altitude
\t\ttry:
\t\t\taltitude_value = float( altitude ) if altitude is not None else 0.0
\t\texcept ( TypeError, ValueError ):
\t\t\taltitude_value = 0.0
\t\tvelocity = state[ 9 ] if len( state ) > 9 else None
\t\theading = state[ 10 ] if len( state ) > 10 else None
\t\ttry:
\t\t\tvelocity_value = float( velocity ) if velocity is not None else 0.0
\t\texcept ( TypeError, ValueError ):
\t\t\tvelocity_value = 0.0
\t\ttry:
\t\t\theading_value = float( heading ) if heading is not None else 0.0
\t\texcept ( TypeError, ValueError ):
\t\t\theading_value = 0.0
\t\tmetadata = {
\t\t\t'ICAO24': icao24,
\t\t\t'Callsign': callsign,
\t\t\t'Origin Country': state[ 2 ],
\t\t\t'Barometric Altitude': baro_altitude,
\t\t\t'Geometric Altitude': geo_altitude,
\t\t\t'Vertical Rate': state[ 11 ] if len( state ) > 11 else None,
\t\t\t'On Ground': on_ground,
\t\t\t'Squawk': state[ 14 ] if len( state ) > 14 else None,
\t\t\t'SPI': state[ 15 ] if len( state ) > 15 else None,
\t\t\t'Position Source': state[ 16 ] if len( state ) > 16 else None,
\t\t\t'Category': state[ 17 ] if len( state ) > 17 else None,
\t\t}
\t\tentities.append( GeoEntity(
\t\t\tentity_id=icao24 or f'OPENSKY-{len( entities ) + 1}',
\t\t\tentity_type='Aircraft',
\t\t\tname=callsign or icao24,
\t\t\tlatitude=lat,
\t\t\tlongitude=lon,
\t\t\taltitude=altitude_value,
\t\t\theading=heading_value,
\t\t\tspeed=velocity_value,
\t\t\ttimestamp=str( state[ 4 ] or '' ),
\t\t\tsource='OpenSky Network',
\t\t\tmetadata=metadata ) )

\tst.session_state[ 'live_world_aircraft_result' ] = result
\treturn entities_to_dataframe( entities )


def fetch_live_satellites( ) -> pd.DataFrame:
\t'''

\t\tPurpose:
\t\t--------
\t\tRetrieve current CelesTrak OMM records, propagate each orbit to the current UTC time,
\t\tand normalize successfully propagated satellites for Live World rendering.

\t\tReturns:
\t\t--------
\t\tpd.DataFrame: Normalized satellite entities.

\t'''
\tinitialize_live_world_state( )
\tgroup = str( st.session_state[ 'live_world_satellite_group' ] )
\tlimit = int( st.session_state[ 'live_world_satellite_limit' ] )
\tservice = CelesTrakLive( timeout=20 )
\trecords = service.fetch_group( group=group, limit=limit )
\twhen = dt.datetime.now( dt.timezone.utc )
\tentities: List[ GeoEntity ] = [ ]

\tfor record in records:
\t\ttry:
\t\t\tposition = service.propagate( record=record, when=when )
\t\texcept Exception:
\t\t\tcontinue
\t\tcatalog_number = str( position.get( 'CatalogNumber', '' ) or '' )
\t\tname = str( position.get( 'Name', '' ) or catalog_number )
\t\tmetadata = {
\t\t\t'Catalog Number': catalog_number,
\t\t\t'Object ID': position.get( 'ObjectId', '' ),
\t\t\t'Epoch': position.get( 'Epoch', '' ),
\t\t\t'Classification': position.get( 'Classification', '' ),
\t\t\t'Group': group,
\t\t}
\t\tentities.append( GeoEntity(
\t\t\tentity_id=catalog_number or name,
\t\t\tentity_type='Satellite',
\t\t\tname=name,
\t\t\tlatitude=float( position[ 'Latitude' ] ),
\t\t\tlongitude=float( position[ 'Longitude' ] ),
\t\t\taltitude=float( position[ 'Altitude' ] ),
\t\t\theading=0.0,
\t\t\tspeed=float( position[ 'Velocity' ] ),
\t\t\ttimestamp=when.isoformat( ),
\t\t\tsource='CelesTrak',
\t\t\tmetadata=metadata ) )

\tst.session_state[ 'live_world_satellite_result' ] = records
\treturn entities_to_dataframe( entities )


'''
          if 'def fetch_live_aircraft(' not in text:
              if fetch_anchor not in text:
                  raise RuntimeError( 'Unable to locate provider-function insertion anchor.' )
              text = text.replace( fetch_anchor, fetch_functions + fetch_anchor, 1 )

          refresh_anchor = "\ttry:\n\t\tif st.session_state[ 'live_world_earthquakes' ]:\n"
          refresh_block = """\ttry:
\t\tif st.session_state[ 'live_world_aircraft' ]:
\t\t\tdf_aircraft = fetch_live_aircraft( latitude, longitude )
\t\t\tst.session_state[ 'live_world_df_aircraft' ] = df_aircraft
\t\t\tif not df_aircraft.empty:
\t\t\t\tframes.append( df_aircraft )
\t\telse:
\t\t\tst.session_state[ 'live_world_df_aircraft' ] = pd.DataFrame( )

\t\tif st.session_state[ 'live_world_satellites' ]:
\t\t\tdf_satellites = fetch_live_satellites( )
\t\t\tst.session_state[ 'live_world_df_satellites' ] = df_satellites
\t\t\tif not df_satellites.empty:
\t\t\t\tframes.append( df_satellites )
\t\telse:
\t\t\tst.session_state[ 'live_world_df_satellites' ] = pd.DataFrame( )

\t\tif st.session_state[ 'live_world_earthquakes' ]:
"""
          if "if st.session_state[ 'live_world_aircraft' ]:" not in text.split( 'def render_live_world_map', 1 )[ 0].split( 'def refresh_live_world_data', 1 )[ 1]:
              if refresh_anchor not in text:
                  raise RuntimeError( 'Unable to locate refresh anchor.' )
              text = text.replace( refresh_anchor, refresh_block, 1 )

          metric_old = """\tmetric_c1, metric_c2, metric_c3, metric_c4 = st.columns( 4, border=True )
\tmetric_c1.metric( 'Entities', f'{len( df_map ):,}' )
\tmetric_c2.metric( 'Earthquakes',
\t\tf'{int( (df_map[ \"EntityType\" ] == \"Earthquake\").sum( ) ):,}' )
\tmetric_c3.metric( 'Fires', f'{int( (df_map[ \"EntityType\" ] == \"Fire\").sum( ) ):,}' )
\tmetric_c4.metric( 'Last Refresh', last_refresh )
"""
          metric_new = """\tmetric_c1, metric_c2, metric_c3, metric_c4, metric_c5 = st.columns( 5, border=True )
\tmetric_c1.metric( 'Entities', f'{len( df_map ):,}' )
\tmetric_c2.metric( 'Aircraft', f'{int( (df_map[ \"EntityType\" ] == \"Aircraft\").sum( ) ):,}' )
\tmetric_c3.metric( 'Satellites', f'{int( (df_map[ \"EntityType\" ] == \"Satellite\").sum( ) ):,}' )
\tmetric_c4.metric( 'Earthquakes', f'{int( (df_map[ \"EntityType\" ] == \"Earthquake\").sum( ) ):,}' )
\tmetric_c5.metric( 'Fires', f'{int( (df_map[ \"EntityType\" ] == \"Fire\").sum( ) ):,}' )
\tst.caption( f'Last refresh: {last_refresh}' )
"""
          if "metric_c2.metric( 'Aircraft'" not in text:
              if metric_old not in text:
                  raise RuntimeError( 'Unable to locate metrics block.' )
              text = text.replace( metric_old, metric_new, 1 )

          layer_anchor = "\tdf_earthquakes = df_map[ df_map[ 'EntityType' ] == 'Earthquake' ].copy( )\n\tdf_fires = df_map[ df_map[ 'EntityType' ] == 'Fire' ].copy( )\n\n\tif not df_earthquakes.empty:\n"
          layer_block = """\tdf_aircraft = df_map[ df_map[ 'EntityType' ] == 'Aircraft' ].copy( )
\tdf_satellites = df_map[ df_map[ 'EntityType' ] == 'Satellite' ].copy( )
\tdf_earthquakes = df_map[ df_map[ 'EntityType' ] == 'Earthquake' ].copy( )
\tdf_fires = df_map[ df_map[ 'EntityType' ] == 'Fire' ].copy( )

\tif not df_aircraft.empty:
\t\tdf_aircraft[ 'Radius' ] = 7000.0 * point_scale
\t\tlayers.append( pdk.Layer(
\t\t\t'ScatterplotLayer', data=df_aircraft,
\t\t\tget_position='[Longitude, Latitude]', get_radius='Radius',
\t\t\tget_fill_color=[ 0, 170, 255, 220 ], get_line_color=[ 220, 245, 255, 240 ],
\t\t\tline_width_min_pixels=1, radius_min_pixels=5, radius_max_pixels=26,
\t\t\tfilled=True, stroked=True, pickable=True ) )

\tif not df_satellites.empty:
\t\tdf_satellites[ 'Radius' ] = 8500.0 * point_scale
\t\tlayers.append( pdk.Layer(
\t\t\t'ScatterplotLayer', data=df_satellites,
\t\t\tget_position='[Longitude, Latitude]', get_radius='Radius',
\t\t\tget_fill_color=[ 180, 120, 255, 220 ], get_line_color=[ 245, 235, 255, 240 ],
\t\t\tline_width_min_pixels=1, radius_min_pixels=5, radius_max_pixels=28,
\t\t\tfilled=True, stroked=True, pickable=True ) )

\tif not df_earthquakes.empty:
"""
          if "df_aircraft = df_map[ df_map[ 'EntityType' ] == 'Aircraft' ]" not in text:
              if layer_anchor not in text:
                  raise RuntimeError( 'Unable to locate map-layer anchor.' )
              text = text.replace( layer_anchor, layer_block, 1 )

          tabs_anchor = """\tentities_tab, earthquakes_tab, fires_tab = st.tabs(
\t\t[ '🌐 Entities', '📈 Earthquakes', '🔥 Fires' ] )
\twith entities_tab:
"""
          tabs_block = """\tentities_tab, aircraft_tab, satellites_tab, earthquakes_tab, fires_tab = st.tabs(
\t\t[ '🌐 Entities', '✈️ Aircraft', '🛰️ Satellites', '📈 Earthquakes', '🔥 Fires' ] )
\twith entities_tab:
"""
          if 'aircraft_tab, satellites_tab' not in text:
              if tabs_anchor not in text:
                  raise RuntimeError( 'Unable to locate Live World tab anchor.' )
              text = text.replace( tabs_anchor, tabs_block, 1 )

          earthquake_tab_anchor = "\twith earthquakes_tab:\n"
          source_tabs = """\twith aircraft_tab:
\t\tdf_aircraft_records = st.session_state.get( 'live_world_df_aircraft', pd.DataFrame( ) )
\t\tif df_aircraft_records is None or df_aircraft_records.empty:
\t\t\tst.info( 'No aircraft records loaded.' )
\t\telse:
\t\t\tst.data_editor( make_live_world_display_frame( df_aircraft_records ),
\t\t\t\tkey='live_world_aircraft_table', use_container_width=True,
\t\t\t\tdisabled=True, hide_index=True )

\twith satellites_tab:
\t\tdf_satellite_records = st.session_state.get( 'live_world_df_satellites', pd.DataFrame( ) )
\t\tif df_satellite_records is None or df_satellite_records.empty:
\t\t\tst.info( 'No satellite records loaded.' )
\t\telse:
\t\t\tst.data_editor( make_live_world_display_frame( df_satellite_records ),
\t\t\t\tkey='live_world_satellite_table', use_container_width=True,
\t\t\t\tdisabled=True, hide_index=True )

\twith earthquakes_tab:
"""
          if 'with aircraft_tab:' not in text:
              text = text.replace( earthquake_tab_anchor, source_tabs, 1 )

          path.write_text( text, encoding='utf-8' )
          PY

      - name: Validate Python syntax
        run: |
          python -m py_compile live_world.py live_world_sources.py app.py

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- live_world.py; then
            echo "Live World Data is already extended."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live_world.py
          git commit -m "Enable live aircraft and satellite layers"
          git push origin feature/live-world-data
