name: Finalize Live World Measurements

on:
  push:
    branches:
      - feature/live-world-measurements
    paths:
      - .github/workflows/implement-live-world-measurements.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-world-measurements

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Finalize clear behavior
        run: python .github/scripts/fix_live_world_measurements_script.py

      - name: Validate Python syntax
        run: python -m py_compile app.py live_world.py live_world_sources.py

      - name: Commit finalization
        run: |
          git config user.name "Terry Eppler"
          git config user.email "terry.eppler@gmail.com"
          git add live_world.py
          git commit -m "Finalize Live World measurement state clearing"
          git push origin feature/live-world-measurements
