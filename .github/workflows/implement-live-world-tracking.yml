name: Implement Live World Tracking

on:
  push:
    branches:
      - feature/live-world-data
    paths:
      - .github/workflows/implement-live-world-tracking.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-world-data

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Implement tracking and trails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path( 'live_world.py' )
          text = path.read_text( encoding='utf-8' )

          old = """LIVE_WORLD_LAYERS: Dict[ str, str ] = {
          \t'aircraft': '✈️ Aircraft (Live)',
          \t'satellites': '🛰️ Satellites',
          \t'earthquakes': '📈 Earthquakes',
          \t'fires': '🔥 Fires (Wildfires)',
          }

          LIVE_WORLD_PENDING_LAYERS: Dict[ str, str ] = {
          \t'military_aircraft': '🛩️ Military Aircraft',
          \t'vessels': '🚢 Vessels & Ships',
          \t'cameras': '📷 CCTV / Web Cameras',
          \t'infrastructure': '📡 Infrastructure (Airports, Ports, etc.)',
          \t'tracking': '🎯 Tracking & Trails',
          \t'measurements': '📏 Measurements & Annotations',
          \t'map_layers': '🗺️ Additional Map Layers',
          }
          """
          new = """LIVE_WORLD_LAYERS: Dict[ str, str ] = {
          \t'aircraft': '✈️ Aircraft (Live)',
          \t'satellites': '🛰️ Satellites',
          \t'earthquakes': '📈 Earthquakes',
          \t'fires': '🔥 Fires (Wildfires)',
          \t'tracking': '🎯 Tracking & Trails',
          }

          LIVE_WORLD_PENDING_LAYERS: Dict[ str, str ] = {
          \t'military_aircraft': '🛩️ Military Aircraft',
          \t'vessels': '🚢 Vessels & Ships',
          \t'cameras': '📷 CCTV / Web Cameras',
          \t'infrastructure': '📡 Infrastructure (Airports, Ports, etc.)',
          \t'measurements': '📏 Measurements & Annotations',
          \t'map_layers': '🗺️ Additional Map Layers',
          }
          """
          if old not in text:
              raise RuntimeError( 'Layer contract anchor not found.' )
          text = text.replace( old, new, 1 )

          old = """\t\t'live_world_firms_area_mode': 'Local Bounding Box',
          \t\t'live_world_refresh_requested': False,
          """
          new = """\t\t'live_world_firms_area_mode': 'Local Bounding Box',
          \t\t'live_world_tracking': False,
          \t\t'live_world_tracking_entity': '',
          \t\t'live_world_tracking_active_entity': '',
          \t\t'live_world_tracking_follow': True,
          \t\t'live_world_tracking_max_points': 100,
          \t\t'live_world_tracking_history': [ ],
          \t\t'live_world_refresh_requested': False,
          """
          if old not in text:
              raise RuntimeError( 'State defaults anchor not found.' )
          text = text.replace( old, new, 1 )

          old = """\t\t\tst.selectbox( 'Fire Area', options=[ 'Local Bounding Box', 'World' ],
          \t\t\t\tkey='live_world_firms_area_mode' )

          \t\tst.divider( )
          """
          new = """\t\t\tst.selectbox( 'Fire Area', options=[ 'Local Bounding Box', 'World' ],
          \t\t\t\tkey='live_world_firms_area_mode' )

          \t\tst.checkbox( LIVE_WORLD_LAYERS[ 'tracking' ], key='live_world_tracking' )
          \t\tif st.session_state[ 'live_world_tracking' ]:
          \t\t\ttracking_options = get_live_world_tracking_options( )
          \t\t\tif tracking_options:
          \t\t\t\ttracking_keys = list( tracking_options.keys( ) )
          \t\t\t\tif st.session_state[ 'live_world_tracking_entity' ] not in tracking_keys:
          \t\t\t\t\tst.session_state[ 'live_world_tracking_entity' ] = tracking_keys[ 0 ]
          \t\t\t\tst.selectbox( 'Tracked Entity', options=tracking_keys,
          \t\t\t\t\tformat_func=lambda value: tracking_options[ value ],
          \t\t\t\t\tkey='live_world_tracking_entity' )
          \t\t\telse:
          \t\t\t\tst.info( 'Refresh Aircraft or Satellites before selecting a tracked entity.' )
          \t\t\tst.checkbox( 'Follow Tracked Entity', key='live_world_tracking_follow' )
          \t\t\tst.slider( 'Trail Points', min_value=10, max_value=500, step=10,
          \t\t\t\tkey='live_world_tracking_max_points' )
          \t\t\tif st.button( 'Clear Trail', icon='🧹', key='live_world_tracking_clear',
          \t\t\t\t\twidth='stretch' ):
          \t\t\t\tclear_live_world_tracking( )

          \t\tst.divider( )
          """
          if old not in text:
              raise RuntimeError( 'Sidebar anchor not found.' )
          text = text.replace( old, new, 1 )

          old = """\tst.session_state[ 'live_world_firms_result' ] = { }
          \tst.session_state[ 'live_world_last_refresh' ] = ''
          """
          new = """\tst.session_state[ 'live_world_firms_result' ] = { }
          \tst.session_state[ 'live_world_tracking_history' ] = [ ]
          \tst.session_state[ 'live_world_tracking_active_entity' ] = ''
          \tst.session_state[ 'live_world_last_refresh' ] = ''
          """
          if old not in text:
              raise RuntimeError( 'Clear data anchor not found.' )
          text = text.replace( old, new, 1 )

          marker = "\ndef refresh_live_world_data( latitude: float, longitude: float ) -> pd.DataFrame:\n"
          if marker not in text:
              raise RuntimeError( 'Refresh function marker not found.' )

          tracking_functions = r'''

          def get_live_world_tracking_options( ) -> Dict[ str, str ]:
          	'''

          		Purpose:
          		--------
          		Return selectable moving entities from the current Live World entity frame.

          		Returns:
          		--------
          		Dict[str, str]: Tracking keys mapped to human-readable labels.

          	'''
          	initialize_live_world_state( )
          	df_entities = st.session_state.get( 'live_world_df_entities', pd.DataFrame( ) )
          	if df_entities is None or df_entities.empty:
          		return { }

          	required = [ 'EntityId', 'EntityType', 'Name' ]
          	if any( column not in df_entities.columns for column in required ):
          		return { }

          	df_tracking = df_entities[ df_entities[ 'EntityType' ].isin(
          		[ 'Aircraft', 'Satellite' ] ) ].copy( )
          	options: Dict[ str, str ] = { }
          	for _, row in df_tracking.iterrows( ):
          		entity_id = str( row[ 'EntityId' ] )
          		entity_type = str( row[ 'EntityType' ] )
          		name = str( row[ 'Name' ] )
          		tracking_key = f'{entity_type}::{entity_id}'
          		options[ tracking_key ] = f'{entity_type} | {name} | {entity_id}'
          	return options


          def clear_live_world_tracking( ) -> None:
          	'''

          		Purpose:
          		--------
          		Clear the current tracking trail without changing the selected tracked entity.

          		Returns:
          		--------
          		None

          	'''
          	initialize_live_world_state( )
          	st.session_state[ 'live_world_tracking_history' ] = [ ]
          	st.session_state[ 'live_world_tracking_active_entity' ] = ''


          def update_live_world_tracking( df_entities: pd.DataFrame ) -> None:
          	'''

          		Purpose:
          		--------
          		Append the selected moving entity's newest position to its in-session trail.

          		Parameters:
          		-----------
          		df_entities (pd.DataFrame): Current normalized Live World entity records.

          		Returns:
          		--------
          		None

          	'''
          	initialize_live_world_state( )
          	throw_if( 'df_entities', df_entities )
          	if not st.session_state[ 'live_world_tracking' ]:
          		return

          	tracking_key = str( st.session_state.get( 'live_world_tracking_entity', '' ) or '' )
          	if not tracking_key or '::' not in tracking_key or df_entities.empty:
          		return

          	entity_type, entity_id = tracking_key.split( '::', 1 )
          	df_match = df_entities[
          		(df_entities[ 'EntityType' ].astype( str ) == entity_type)
          		& (df_entities[ 'EntityId' ].astype( str ) == entity_id) ].copy( )
          	if df_match.empty:
          		return

          	active_entity = str( st.session_state.get(
          		'live_world_tracking_active_entity', '' ) or '' )
          	if active_entity != tracking_key:
          		st.session_state[ 'live_world_tracking_history' ] = [ ]
          		st.session_state[ 'live_world_tracking_active_entity' ] = tracking_key

          	row = df_match.iloc[ 0 ]
          	point = {
          		'EntityKey': tracking_key,
          		'EntityId': str( row[ 'EntityId' ] ),
          		'EntityType': str( row[ 'EntityType' ] ),
          		'Name': str( row[ 'Name' ] ),
          		'Latitude': float( row[ 'Latitude' ] ),
          		'Longitude': float( row[ 'Longitude' ] ),
          		'Altitude': float( row[ 'Altitude' ] ),
          		'Heading': float( row[ 'Heading' ] ),
          		'Speed': float( row[ 'Speed' ] ),
          		'Timestamp': str( row[ 'Timestamp' ] ),
          		'ObservedAt': dt.datetime.now( dt.timezone.utc ).isoformat( ),
          	}

          	history = list( st.session_state.get( 'live_world_tracking_history', [ ] ) or [ ] )
          	if history:
          		previous = history[ -1 ]
          		if (float( previous[ 'Latitude' ] ) == point[ 'Latitude' ]
          				and float( previous[ 'Longitude' ] ) == point[ 'Longitude' ]):
          			return

          	history.append( point )
          	max_points = int( st.session_state[ 'live_world_tracking_max_points' ] )
          	st.session_state[ 'live_world_tracking_history' ] = history[ -max_points: ]


          def get_live_world_tracking_frame( ) -> pd.DataFrame:
          	'''

          		Purpose:
          		--------
          		Return the current tracking trail as a DataFrame for rendering and inspection.

          		Returns:
          		--------
          		pd.DataFrame: Ordered tracking trail points.

          	'''
          	initialize_live_world_state( )
          	history = list( st.session_state.get( 'live_world_tracking_history', [ ] ) or [ ] )
          	columns = [ 'EntityKey', 'EntityId', 'EntityType', 'Name', 'Latitude', 'Longitude',
          		'Altitude', 'Heading', 'Speed', 'Timestamp', 'ObservedAt' ]
          	return pd.DataFrame( history, columns=columns )
          '''
          text = text.replace( marker, tracking_functions + marker, 1 )

          old = """\t\tst.session_state[ 'live_world_df_entities' ] = df_entities
          \t\tst.session_state[ 'live_world_last_refresh' ] = dt.datetime.now( ).strftime(
          """
          new = """\t\tst.session_state[ 'live_world_df_entities' ] = df_entities
          \t\tupdate_live_world_tracking( df_entities )
          \t\tst.session_state[ 'live_world_last_refresh' ] = dt.datetime.now( ).strftime(
          """
          if old not in text:
              raise RuntimeError( 'Refresh persistence anchor not found.' )
          text = text.replace( old, new, 1 )

          old = """\tif not df_fires.empty:
          \t\tdf_fires[ 'Radius' ] = 9000.0 * point_scale
          \t\tlayers.append( pdk.Layer(
          \t\t\t'ScatterplotLayer', data=df_fires,
          \t\t\tget_position='[Longitude, Latitude]', get_radius='Radius',
          \t\t\tget_fill_color=[ 255, 70, 0, 210 ], get_line_color=[ 255, 225, 180, 230 ],
          \t\t\tline_width_min_pixels=1, radius_min_pixels=4, radius_max_pixels=28,
          \t\t\tfilled=True, stroked=True, pickable=True ) )

          \tcenter_latitude = float( latitude )
          """
          new = """\tif not df_fires.empty:
          \t\tdf_fires[ 'Radius' ] = 9000.0 * point_scale
          \t\tlayers.append( pdk.Layer(
          \t\t\t'ScatterplotLayer', data=df_fires,
          \t\t\tget_position='[Longitude, Latitude]', get_radius='Radius',
          \t\t\tget_fill_color=[ 255, 70, 0, 210 ], get_line_color=[ 255, 225, 180, 230 ],
          \t\t\tline_width_min_pixels=1, radius_min_pixels=4, radius_max_pixels=28,
          \t\t\tfilled=True, stroked=True, pickable=True ) )

          \tdf_tracking = get_live_world_tracking_frame( )
          \tif st.session_state[ 'live_world_tracking' ] and not df_tracking.empty:
          \t\tif len( df_tracking ) > 1:
          \t\t\tpath_data = [ {
          \t\t\t\t'Path': df_tracking[ [ 'Longitude', 'Latitude' ] ].values.tolist( ) } ]
          \t\t\tlayers.append( pdk.Layer(
          \t\t\t\t'PathLayer', data=path_data, get_path='Path',
          \t\t\t\tget_color=[ 0, 255, 170, 235 ], get_width=5,
          \t\t\t\twidth_min_pixels=2, width_max_pixels=8, pickable=False ) )

          \t\tdf_tracked_point = df_tracking.tail( 1 ).copy( )
          \t\tdf_tracked_point[ 'Radius' ] = 15000.0 * point_scale
          \t\tlayers.append( pdk.Layer(
          \t\t\t'ScatterplotLayer', data=df_tracked_point,
          \t\t\tget_position='[Longitude, Latitude]', get_radius='Radius',
          \t\t\tget_fill_color=[ 0, 255, 170, 80 ], get_line_color=[ 0, 255, 170, 255 ],
          \t\t\tline_width_min_pixels=3, radius_min_pixels=10, radius_max_pixels=40,
          \t\t\tfilled=True, stroked=True, pickable=False ) )

          \tcenter_latitude = float( latitude )
          """
          if old not in text:
              raise RuntimeError( 'Map layer anchor not found.' )
          text = text.replace( old, new, 1 )

          old = """\tif not (-90.0 <= center_latitude <= 90.0 and -180.0 <= center_longitude <= 180.0):
          \t\tcenter_latitude = float( df_map[ 'Latitude' ].median( ) )
          \t\tcenter_longitude = float( df_map[ 'Longitude' ].median( ) )

          \tview_state = pdk.ViewState(
          """
          if old not in text:
              old = """\tif not (-90.0 <= center_latitude <= 90.0 and -180.0 <= center_longitude <= 180.0):
          \t\tcenter_latitude = float( df_map[ 'Latitude' ].median( ) )
          \t\tcenter_longitude = float( df_map[ 'Longitude' ].median( ) )

          \tview_state = pdk.ViewState( latitude=center_latitude, longitude=center_longitude,
          """
              new = """\tif not (-90.0 <= center_latitude <= 90.0 and -180.0 <= center_longitude <= 180.0):
          \t\tcenter_latitude = float( df_map[ 'Latitude' ].median( ) )
          \t\tcenter_longitude = float( df_map[ 'Longitude' ].median( ) )
          \tif (st.session_state[ 'live_world_tracking' ]
          \t\t\tand st.session_state[ 'live_world_tracking_follow' ]
          \t\t\tand not df_tracking.empty):
          \t\tcenter_latitude = float( df_tracking.iloc[ -1 ][ 'Latitude' ] )
          \t\tcenter_longitude = float( df_tracking.iloc[ -1 ][ 'Longitude' ] )

          \tview_state = pdk.ViewState( latitude=center_latitude, longitude=center_longitude,
          """
          else:
              new = """\tif not (-90.0 <= center_latitude <= 90.0 and -180.0 <= center_longitude <= 180.0):
          \t\tcenter_latitude = float( df_map[ 'Latitude' ].median( ) )
          \t\tcenter_longitude = float( df_map[ 'Longitude' ].median( ) )
          \tif (st.session_state[ 'live_world_tracking' ]
          \t\t\tand st.session_state[ 'live_world_tracking_follow' ]
          \t\t\tand not df_tracking.empty):
          \t\tcenter_latitude = float( df_tracking.iloc[ -1 ][ 'Latitude' ] )
          \t\tcenter_longitude = float( df_tracking.iloc[ -1 ][ 'Longitude' ] )

          \tview_state = pdk.ViewState(
          """
          if old not in text:
              raise RuntimeError( 'View-state anchor not found.' )
          text = text.replace( old, new, 1 )

          old = """\tentities_tab, aircraft_tab, satellites_tab, earthquakes_tab, fires_tab = st.tabs(
          \t\t[ '🌐 Entities', '✈️ Aircraft', '🛰️ Satellites', '📈 Earthquakes', '🔥 Fires' ] )
          """
          new = """\tentities_tab, aircraft_tab, satellites_tab, earthquakes_tab, fires_tab, tracking_tab = st.tabs(
          \t\t[ '🌐 Entities', '✈️ Aircraft', '🛰️ Satellites', '📈 Earthquakes', '🔥 Fires',
          \t\t\t'🎯 Tracking' ] )
          """
          if old not in text:
              raise RuntimeError( 'Tabs anchor not found.' )
          text = text.replace( old, new, 1 )

          old = """\twith fires_tab:
          \t\tdf_fire_records = st.session_state.get( 'live_world_df_fires', pd.DataFrame( ) )
          \t\tif df_fire_records is None or df_fire_records.empty:
          \t\t\tst.info( 'No fire records loaded.' )
          \t\telse:
          \t\t\tst.data_editor( make_live_world_display_frame( df_fire_records ),
          \t\t\t\tkey='live_world_fire_table', use_container_width=True,
          \t\t\t\tdisabled=True, hide_index=True )


          def get_metadata_number( metadata: object, key: str, default: float=0.0 ) -> float:
          """
          new = """\twith fires_tab:
          \t\tdf_fire_records = st.session_state.get( 'live_world_df_fires', pd.DataFrame( ) )
          \t\tif df_fire_records is None or df_fire_records.empty:
          \t\t\tst.info( 'No fire records loaded.' )
          \t\telse:
          \t\t\tst.data_editor( make_live_world_display_frame( df_fire_records ),
          \t\t\t\tkey='live_world_fire_table', use_container_width=True,
          \t\t\t\tdisabled=True, hide_index=True )

          \twith tracking_tab:
          \t\tif df_tracking.empty:
          \t\t\tst.info( 'No tracking trail has been recorded. Select an aircraft or satellite and Refresh.' )
          \t\telse:
          \t\t\ttracking_c1, tracking_c2, tracking_c3 = st.columns( 3, border=True )
          \t\t\ttracking_c1.metric( 'Trail Points', f'{len( df_tracking ):,}' )
          \t\t\ttracking_c2.metric( 'Entity', str( df_tracking.iloc[ -1 ][ 'Name' ] ) )
          \t\t\ttracking_c3.metric( 'Type', str( df_tracking.iloc[ -1 ][ 'EntityType' ] ) )
          \t\t\tst.data_editor( df_tracking, key='live_world_tracking_table',
          \t\t\t\tuse_container_width=True, disabled=True, hide_index=True )


          def get_metadata_number( metadata: object, key: str, default: float=0.0 ) -> float:
          """
          if old not in text:
              raise RuntimeError( 'Tracking tab anchor not found.' )
          text = text.replace( old, new, 1 )

          text = text.replace(
              'live aircraft, satellite, earthquake, and active-fire retrieval, normalized geospatial\n    entities, operational PyDeck rendering, refresh controls, filtering, and source-data\n    inspection.',
              'live aircraft, satellite, earthquake, and active-fire retrieval, normalized geospatial\n    entities, operational PyDeck rendering, entity tracking and trails, refresh controls,\n    filtering, and source-data inspection.',
              1 )

          path.write_text( text, encoding='utf-8' )
          PY

      - name: Compile Python sources
        run: python -m py_compile live_world.py live_world_sources.py app.py

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "Terry Eppler"
          git config user.email "terry.eppler@gmail.com"
          git add live_world.py
          git diff --cached --quiet && exit 0
          git commit -m "Implement Live World tracking and trails"
          git push origin HEAD:feature/live-world-data
