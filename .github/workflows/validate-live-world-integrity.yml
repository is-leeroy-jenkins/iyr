name: Implement Live World Cross-Layer Analysis

on:
  push:
    branches:
      - feature/live-world-cross-layer
    paths:
      - .github/workflows/validate-live-world-integrity.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-world-cross-layer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check conflict markers
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' --include='*.md' . --exclude-dir=.git; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Repair implementation helper quoting
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path( '.github/scripts/implement_live_world_cross_layer.py' )
          text = path.read_text( encoding='utf-8' )
          text = text.replace( "functions = r'''", 'functions = r"""', 1 )
          text = text.replace(
              "\n'''\ntext = text.replace( marker, functions + marker, 1 )",
              '\n"""\ntext = text.replace( marker, functions + marker, 1 )', 1 )
          path.write_text( text, encoding='utf-8' )
          PY

      - name: Implement Cross-Layer Analysis
        run: python .github/scripts/implement_live_world_cross_layer.py

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify Cross-Layer Analysis contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          live_world = Path( 'live_world.py' ).read_text( encoding='utf-8' )
          required = [
              "'cross_layer_analysis': '🧭 Cross-Layer Analysis'",
              'def get_live_world_analysis_origin_options( )',
              'def resolve_live_world_analysis_origin( key: str, latitude: float,',
              'def calculate_live_world_cross_layer_analysis( latitude: float,',
              "key='live_world_cross_layer_analysis'",
              "'🧭 Analysis'",
              "key='live_world_analysis_table'",
              "key='live_world_analysis_nearest_by_type_table'",
          ]
          for value in required:
              if value not in live_world:
                  raise RuntimeError( f'Missing Cross-Layer Analysis contract: {value}' )
          print( 'Cross-Layer Analysis contracts verified.' )
          PY

      - name: Commit implementation
        run: |
          git config user.name "Terry Eppler"
          git config user.email "terry.eppler@gmail.com"
          git add live_world.py
          git commit -m "Implement Live World cross-layer spatial analysis"
          git push origin feature/live-world-cross-layer
