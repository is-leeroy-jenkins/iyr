name: Implement Live World Infrastructure

on:
  push:
    branches:
      - feature/live-world-infrastructure
    paths:
      - .github/workflows/implement-live-world-infrastructure.yml
      - .github/scripts/implement_live_world_infrastructure.py

jobs:
  implement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-world-infrastructure
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Implement Infrastructure
        run: python .github/scripts/implement_live_world_infrastructure.py

      - name: Check conflict markers
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.toml' --include='*.yml' --include='*.yaml' --include='*.md' . --exclude-dir=.git; then
            echo 'Unresolved merge markers found.'
            exit 1
          fi

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Verify Infrastructure contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          live_world = Path( 'live_world.py' ).read_text( encoding='utf-8' )
          sources = Path( 'live_world_sources.py' ).read_text( encoding='utf-8' )
          required_live_world = [
              "'infrastructure': '📡 Infrastructure (Airports, Ports, etc.)'",
              "'live_world_infrastructure': False",
              'def fetch_live_infrastructure( latitude: float, longitude: float )',
              "key='live_world_infrastructure'",
              "'📡 Infrastructure'",
              'with infrastructure_tab:',
              "df_infrastructure = fetch_live_infrastructure( latitude, longitude )",
          ]
          required_sources = [
              'class OverpassInfrastructure:',
              'def fetch_infrastructure( self, latitude: float, longitude: float,',
              'def classify_infrastructure( self, tags: Dict[ str, Any ] )',
              "'Airports'", "'Ports'", "'Power Plants'", "'Dams'",
              "'Data Centers'", "'Military Installations'",
          ]
          for value in required_live_world:
              if value not in live_world:
                  raise RuntimeError( f'Missing Infrastructure Live World contract: {value}' )
          for value in required_sources:
              if value not in sources:
                  raise RuntimeError( f'Missing Infrastructure provider contract: {value}' )
          print( 'Infrastructure contracts verified.' )
          PY

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet -- live_world.py live_world_sources.py; then
            echo 'No Infrastructure implementation changes detected.'
            exit 1
          fi
          git config user.name 'Terry Eppler'
          git config user.email 'terry.eppler@gmail.com'
          git add live_world.py live_world_sources.py
          git commit -m 'Implement Live World infrastructure layer'
          git push origin feature/live-world-infrastructure
